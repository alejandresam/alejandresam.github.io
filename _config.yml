tagline: "Electrical & Computer Engineering M.S. Student | Machine Learning Researcher"
description: >-
  Personal portfolio featuring selected projects, research, and writing in machine learning, data science, and applied AI.
  Built with Jekyll for a clean, modern, and easy-to-scan presentation.
baseurl: ""
url: "https://alejandresam.github.io"
repository: "alejandresam/alejandresam.github.io"
timezone: America/Los_Angeles

title: "./run_samy"
remote_theme: "mmistakes/minimal-mistakes@4.26.2"

author:
  name: "Samantha Alejandre"
  avatar: "/assets/images/Samantha_headshot.jpg"
  bio: "Electrical & Computer Engineering M.S. student and researcher at UCLA focused on machine learning, data science, and applied AI."
  location: "Los Angeles, CA"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:alejandresam@g.ucla.edu"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/alejandresam"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/samanthaalejandre"

markdown: kramdown
sass:
  load_paths:
    - _sass
    - assets/css

highlighter: rouge
permalink: /:categories/:title/
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-last-modified-at

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
